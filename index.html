<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>전선 디펜스 프로토타입 v0.1.1</title>
<style>
body{margin:0;background:#11151c;color:#eef3fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#app{max-width:480px;margin:0 auto;padding:10px}
h1{font-size:17px;margin:0 0 8px}.sub{font-size:12px;color:#9ba8ba;margin-bottom:8px}
canvas{width:100%;display:block;background:#18202b;border:1px solid #334057;border-radius:12px}
.row{display:flex;gap:6px;margin-top:8px}
button{flex:1;padding:10px;border:0;border-radius:9px;background:#263247;color:white;font-weight:700}
button.primary{background:#2e7dd1} button.danger{background:#8b3c46}
.panel{margin-top:8px;padding:8px;background:#1b2230;border-radius:10px}
.small{font-size:11px;color:#aeb9c9}.hero{display:flex;gap:6px;align-items:center;margin-top:5px}
.hero span{flex:1;font-size:11px}.hero button{flex:0 0 42px;padding:6px}
</style>
</head>
<body>
<div id="app">
<h1>전선 디펜스 프로토타입 v0.1.1</h1>
<div class="sub">아이폰 Safari 호환 단순 버전</div>
<canvas id="cv" width="450" height="700"></canvas>
<div class="row">
<button id="start" class="primary">시작</button>
<button id="pause">일시정지</button>
<button id="speed">1×</button>
<button id="reset" class="danger">리셋</button>
</div>
<div class="panel">
<div class="small">전술 순번</div>
<div id="heroes"></div>
</div>
<div class="panel small" id="status">대기 중</div>
</div>
<script>
(function(){
var c=document.getElementById('cv'),x=c.getContext('2d'),W=c.width,H=c.height;
var heroes=[
 {n:'지원',t:'buff'},{n:'포격',t:'bomb'},{n:'치유',t:'heal'},{n:'제어',t:'slow'}
];
var S;
function reset(){
 S={run:false,pause:false,spd:1,t:0,aHP:1000,eHP:1000,units:[],spawnA:0,spawnE:0,heroI:0,heroT:1.2,buff:0,slow:0,ended:false};
 document.getElementById('status').innerHTML='대기 중';
 document.getElementById('start').innerHTML='시작';
 document.getElementById('speed').innerHTML='1×';
 draw();
}
function add(team,type){
 var hp=type==0?90:type==1?65:type==2?80:100;
 var atk=type==0?18:type==1?16:type==2?20:15;
 var spd=type==0?30:type==1?25:type==2?45:27;
 S.units.push({team:team,type:type,x:W/2+(Math.random()-.5)*45,y:team==0?H-62:62,hp:hp,max:hp,atk:atk,spd:spd,cd:0});
}
function pack(team){
 var base=Math.floor(S.t/8)%4;
 add(team,base); add(team,(base+1)%4); add(team,(base+2)%4);
 if(team==1 && S.t<25) add(team,(base+3)%4);
}
function beats(a,b){
 return (a==0&&b==3)||(a==3&&b==2)||(a==2&&b==1)||(a==1&&b==0);
}
function mult(a,b){if(beats(a,b))return 1.3;if(beats(b,a))return .8;return 1;}
function nearest(u){
 var q=null,d=99999,i,v,dy;
 for(i=0;i<S.units.length;i++){v=S.units[i];if(v.team==u.team||v.hp<=0)continue;dy=Math.abs(v.y-u.y);if(dy<d){d=dy;q=v;}}
 return [q,d];
}
function front(){
 var aa=[],ee=[],i,u;
 for(i=0;i<S.units.length;i++){u=S.units[i];if(u.team==0)aa.push(u.y);else ee.push(u.y);}
 if(!aa.length||!ee.length)return H/2;
 return (Math.min.apply(null,aa)+Math.max.apply(null,ee))/2;
}
function castHero(){
 var h=heroes[S.heroI],f=front(),i,u,n=0;
 if(h.t=='buff'){S.buff=S.t+4;msg((S.heroI+1)+'번 지원: 아군 공격 버프');}
 if(h.t=='bomb'){
   for(i=0;i<S.units.length;i++){u=S.units[i];if(u.team==1&&Math.abs(u.y-f)<95){u.hp-=55;n++;}}
   msg((S.heroI+1)+'번 포격: '+n+'기 타격');
 }
 if(h.t=='heal'){
   for(i=0;i<S.units.length;i++){u=S.units[i];if(u.team==0&&Math.abs(u.y-f)<135){u.hp=Math.min(u.max,u.hp+40);n++;}}
   msg((S.heroI+1)+'번 치유: '+n+'기 회복');
 }
 if(h.t=='slow'){S.slow=S.t+3;msg((S.heroI+1)+'번 제어: 적 둔화');}
 S.heroI=(S.heroI+1)%heroes.length; S.heroT=2.35;
}
function msg(s){document.getElementById('status').innerHTML='['+Math.floor(S.t)+'초] '+s;}
function update(dt){
 if(!S.run||S.pause||S.ended)return;
 dt*=S.spd; S.t+=dt; S.spawnA-=dt; S.spawnE-=dt; S.heroT-=dt;
 if(S.spawnA<=0){pack(0);S.spawnA=4.4;}
 if(S.spawnE<=0){pack(1);S.spawnE=S.t<25?3.9:4.4;}
 if(S.heroT<=0)castHero();
 var i,u,r,target,d,dir,sl;
 for(i=0;i<S.units.length;i++){
   u=S.units[i]; if(u.hp<=0)continue; u.cd-=dt; r=nearest(u);target=r[0];d=r[1];
   sl=(u.team==1&&S.t<S.slow)?0.55:1;
   if(target&&d<28+(u.type==1?75:0)){
     if(u.cd<=0){target.hp-=u.atk*mult(u.type,target.type)*(u.team==0&&S.t<S.buff?1.35:1);u.cd=.8;}
   }else{
     dir=u.team==0?-1:1;u.y+=dir*u.spd*sl*dt;u.x+=(W/2-u.x)*.5*dt;
   }
   if(u.team==0&&u.y<45)S.eHP-=u.atk*.5*dt;
   if(u.team==1&&u.y>H-45)S.aHP-=u.atk*.5*dt;
 }
 S.units=S.units.filter(function(z){return z.hp>0&&z.y>-20&&z.y<H+20;});
 if(S.aHP<=0||S.eHP<=0){S.ended=true;S.run=false;msg(S.eHP<=0?'승리':'패배');}
}
function draw(){
 x.clearRect(0,0,W,H); x.fillStyle='#1c2633';x.fillRect(85,0,W-170,H);
 x.fillStyle='#842f3d';x.fillRect(125,15,W-250,35);x.fillStyle='#2a7282';x.fillRect(125,H-50,W-250,35);
 x.fillStyle='white';x.font='12px -apple-system';x.textAlign='center';x.fillText('적 본진 '+Math.max(0,Math.ceil(S.eHP)),W/2,38);x.fillText('아군 본진 '+Math.max(0,Math.ceil(S.aHP)),W/2,H-27);
 var fy=front();x.strokeStyle='#ffd166';x.setLineDash([7,5]);x.beginPath();x.moveTo(95,fy);x.lineTo(W-95,fy);x.stroke();x.setLineDash([]);
 var i,u,col=['#f7c873','#79d48b','#a889ff','#72a7ff'];
 for(i=0;i<S.units.length;i++){u=S.units[i];x.fillStyle=col[u.type];x.strokeStyle=u.team==0?'#66d9ef':'#ff7b88';x.lineWidth=2;x.beginPath();x.arc(u.x,u.y,8,0,Math.PI*2);x.fill();x.stroke();}
 // simple defense towers
 x.fillStyle='#3a8797';x.fillRect(125,H-115,28,28);x.fillRect(W-153,H-115,28,28);
 x.fillStyle='#9b4450';x.fillRect(125,87,28,28);x.fillRect(W-153,87,28,28);
 x.fillStyle='#dce4ef';x.font='11px -apple-system';x.fillText('전선',W-115,fy-5);
 // hero bar
 for(i=0;i<heroes.length;i++){x.fillStyle=i==S.heroI&&S.run?'#3c526f':'#202b3a';x.fillRect(20+i*105,H-88,92,28);x.fillStyle='white';x.fillText((i+1)+'.'+heroes[i].n,66+i*105,H-70);}
}
function heroUI(){
 var box=document.getElementById('heroes');box.innerHTML='';
 for(var i=0;i<heroes.length;i++){
   (function(i){
     var d=document.createElement('div');d.className='hero';
     d.innerHTML='<span>'+(i+1)+'번 · '+heroes[i].n+'</span><button>↑</button><button>↓</button>';
     var bs=d.getElementsByTagName('button');
     bs[0].onclick=function(){if(S.run)return;if(i>0){var q=heroes[i-1];heroes[i-1]=heroes[i];heroes[i]=q;heroUI();}};
     bs[1].onclick=function(){if(S.run)return;if(i<heroes.length-1){var q=heroes[i+1];heroes[i+1]=heroes[i];heroes[i]=q;heroUI();}};
     box.appendChild(d);
   })(i);
 }
}
document.getElementById('start').onclick=function(){if(S.ended)return;S.run=true;S.pause=false;this.innerHTML='진행 중';msg('전투 시작');};
document.getElementById('pause').onclick=function(){if(!S.run)return;S.pause=!S.pause;this.innerHTML=S.pause?'계속':'일시정지';};
document.getElementById('speed').onclick=function(){S.spd=S.spd==1?2:S.spd==2?4:1;this.innerHTML=S.spd+'×';};
document.getElementById('reset').onclick=reset;
var last=Date.now();
function loop(){var now=Date.now(),dt=Math.min((now-last)/1000,.033);last=now;update(dt);draw();requestAnimationFrame(loop);}
heroUI();reset();loop();
})();
</script>
</body>
</html>
